{% extends "dashboard/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">The operations dashboard is restricted to staff accounts.</p>
{% if form.errors %}<p class="banner">Invalid username or password.</p>{% endif %}
<form method="post" class="filters" style="flex-direction:column; max-width:320px">
  {% csrf_token %}
  <input type="text" name="username" placeholder="Username" autofocus autocomplete="username">
  <input type="password" name="password" placeholder="Password" autocomplete="current-password">
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
