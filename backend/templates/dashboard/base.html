<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · CodePilotAI</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#0f1220; --panel:#181c2e; --panel2:#212642; --fg:#e8eaf2;
      --muted:#9aa0bd; --line:#2c3350; --accent:#6ea8fe;
      --ok:#3ecf8e; --warn:#f0b429; --bad:#f2555a;
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.75rem;
      padding:.7rem 1.25rem; background:var(--panel); border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; }
    nav { display:flex; align-items:center; gap:1rem; margin-left:auto; }
    nav a.active { color:var(--fg); font-weight:600; }
    nav form { margin:0; }
    main { max-width:1100px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    h1 { font-size:1.4rem; margin:.25rem 0 1rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    h2 { font-size:1.05rem; margin:1.6rem 0 .5rem; }
    .muted { color:var(--muted); }
    .banner { background:#2a2410; border:1px solid #5c4b12; color:#f0d99a;
      padding:.5rem .75rem; border-radius:8px; margin:0 0 1rem; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.75rem; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:.75rem 1rem; }
    .card .k { color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; }
    .card .v { font-size:1.5rem; font-weight:700; margin-top:.1rem; }
    table { width:100%; border-collapse:collapse; background:var(--panel);
      border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th, td { text-align:left; padding:.5rem .7rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { background:var(--panel2); color:var(--muted); font-size:.75rem;
      text-transform:uppercase; letter-spacing:.04em; }
    tr:last-child td { border-bottom:0; }
    .chip { display:inline-block; padding:.05rem .55rem; border-radius:999px; font-size:.75rem;
      background:var(--panel2); border:1px solid var(--line); white-space:nowrap; }
    form.filters { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
    input, select, button { font:inherit; color:inherit; background:var(--panel);
      border:1px solid var(--line); border-radius:8px; padding:.35rem .55rem; }
    button { cursor:pointer; }
    input[type="search"] { min-width:16rem; }
    pre { margin:.25rem 0; background:var(--panel); border:1px solid var(--line);
      border-radius:8px; padding:.6rem .7rem; overflow:auto; white-space:pre-wrap; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; align-items:start; }
    @media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <span class="brand">CodePilotAI</span>
  <span class="muted">operations</span>
  <nav>
    <a href="{% url 'dashboard:home' %}" class="{% if active_nav == 'home' %}active{% endif %}">Overview</a>
    <a href="{% url 'dashboard:task-list' %}" class="{% if active_nav == 'tasks' %}active{% endif %}">Tasks</a>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.display_name }}</span>
      <form method="post" action="{% url 'dashboard:logout' %}">
        {% csrf_token %}<button type="submit">Sign out</button>
      </form>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
